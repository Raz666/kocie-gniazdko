  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;section class=&quot;kg-section kg-steps&quot;&gt;&lt;div class=&quot;kg-eyebrow&quot;&gt;Od planu do pobytu&lt;/div&gt;&lt;h2&gt;Ty planujesz wyjazd.&lt;br&gt;My czekamy na kota.&lt;/h2&gt;&lt;ol class=&quot;kg-step-list&quot;&gt;&lt;li&gt;&lt;span class=&quot;kg-step-number&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Wybierasz termin&lt;/h3&gt;&lt;p&gt;Podajesz daty i preferowane godziny przyjazdu oraz odbioru.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;kg-step-number&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Wysyłasz zgłoszenie&lt;/h3&gt;&lt;p&gt;Opowiadasz nam o swoim kocie i jego potrzebach. Bez zakładania konta.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;kg-step-number&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Potwierdzamy pobyt&lt;/h3&gt;&lt;p&gt;Sprawdzamy zgłoszenie i kontaktujemy się telefonicznie lub e-mailem.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
  &lt;section id=&quot;kg-hotel&quot; class=&quot;kg-section kg-hotel&quot;&gt;&lt;div class=&quot;kg-eyebrow&quot;&gt;Poznaj Kocie Gniazdko&lt;/div&gt;&lt;h2&gt;Mały pensjonat.&lt;br&gt;Dużo troski.&lt;/h2&gt;&lt;p class=&quot;kg-copy&quot;&gt;Na zielonych Jelonkach, na granicy Woli i Bemowa, stworzyliśmy spokojną przystań dla kotów. Z dala od ruchliwych ulic, blisko tego, co lubią najbardziej.&lt;/p&gt;&lt;ul class=&quot;kg-features&quot;&gt;&lt;li&gt;&lt;i data-lucide=&quot;heart&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Całodobowa, troskliwa opieka&lt;/li&gt;&lt;li&gt;&lt;i data-lucide=&quot;house&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Miejsce na odpoczynek i zabawę&lt;/li&gt;&lt;li&gt;&lt;i data-lucide=&quot;trees&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Zabezpieczony letni wybieg&lt;/li&gt;&lt;/ul&gt;&lt;a class=&quot;kg-textlink&quot; href=&quot;https://www.kociegniazdko.pl/o-nas/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Więcej o naszym hotelu&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/a&gt;&lt;figure&gt;&lt;img class=&quot;kg-photo&quot; src=&quot;data:image/webp;base64,UklGRqzIAQBXRUJQVlA4IKDIAQBQJQWdASogA1gCPlUkjkSjoiEjrhK8oHAKiWVrj6D6NjNHBY0TAW5Pn5m32e/oHz2Dne+Wtzj6F/zNKO736a/1ebj7v/o+dn/xevb+w+jB5eXsn8437rerF+Y3wm/vnqVf4b0mvXE/vXqpecj61f9p/9vpr6efKe84/j/+F4G/k/0D+k/uf+W/ZH99Psf+2fqbwXeufzv7T+on86/If93/G+z7+L/9n+Y8Zfz/9+/9f+L9gv83/sH7Eeqv9j+2f/F8HXZf9X+1/sI+8H4z9pvS8+n/9n+r9Xv1r/Of+7/QfAN/Tv8L6T/9HxLPx3/G/bv4Cv7R/qv/n/svdx/4fMP+0f9D2Fv6v/rf2z4adJSc9h5AXCMuGWMhTy1X2Q3kCkqku1n8ypuBuFlV9PvtZueK78cB7emHv/1RaEWCMoz0nLEGapWAR2QGAfqaa5CbhlLB+N4IDH9H2MwDgvkzi8NrUu5aDszVFQzyZ47e5TA1VJux3W31hdk//o/ipsFGQWkhdj5S9EFhoFkbKHF3cXfgdysT3B3yTR/KILDrio6XefE3aENmfkOA+b0P30/B00Gcc8CBSkXYJKTefrPueQXjrnyPL//G380b8e/H5RxK/qmj4nntjyJXcPPgrmdaS9OeqT4e2BYF96y3iZ0dkd3eSNPIqbQf/LA8PcHhL/hN3exKF5IQYc6gfUk1/qpLy4lQfs1Xld23r6CRiY/43Na21/uLCufWb6TDxxqjnFC9L+FwJerS6HaEoW3hUBFlEMXfcYvg1jVqttuyZ++QTUmKk7U   &lt;section id=&quot;kg-prep&quot; class=&quot;kg-section kg-prep&quot;&gt;&lt;div class=&quot;kg-eyebrow&quot;&gt;Przed pierwszą wizytą&lt;/div&gt;&lt;h2&gt;Spakuj odrobinę domu.&lt;/h2&gt;&lt;p class=&quot;kg-copy&quot;&gt;Przed przyjazdem sprawdź zasady pobytu. Przygotuj najważniejsze rzeczy i informacje o swoim kocie.&lt;/p&gt;&lt;ul class=&quot;kg-checklist&quot;&gt;&lt;li&gt;Książeczka zdrowia z aktualnymi szczepieniami.&lt;/li&gt;&lt;li&gt;Własna karma, jeśli wybierasz ten wariant pobytu.&lt;/li&gt;&lt;li&gt;Informacje o żywieniu, zdrowiu i przyzwyczajeniach kota.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;kg-prep-links&quot;&gt;&lt;a href=&quot;https://www.kociegniazdko.pl/oferta/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Jak przygotować kota do pobytu&lt;i data-lucide=&quot;arrow-up-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/a&gt;&lt;a href=&quot;https://www.kociegniazdko.pl/regulamin/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Przeczytaj regulamin&lt;i data-lucide=&quot;arrow-up-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/a&gt;&lt;/div&gt;&lt;h3 class=&quot;kg-faq-heading&quot;&gt;Dobrze wiedzieć&lt;/h3&gt;&lt;div class=&quot;kg-faq&quot;&gt;&lt;details open&gt;&lt;summary&gt;Czy zgłoszenie potwierdza rezerwację?&lt;i data-lucide=&quot;chevron-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;p&gt;Jeszcze nie. Najpierw sprawdzamy zgłoszenie, a następnie kontaktujemy się z Tobą telefonicznie lub e-mailem, aby potwierdzić pobyt.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Czy muszę zakładać konto?&lt;i data-lucide=&quot;chevron-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;p&gt;Nie. Zgłoszenie możesz wysłać bez konta. Samodzielnie wybierasz, czy chcesz zachować swoje dane na kolejny pobyt.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Czy mogę przywieźć własną karmę?&lt;i data-lucide=&quot;chevron-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;p&gt;Tak. Wybierz pobyt z własną karmą i przekaż nam informacje o sposobie żywienia Twojego kota.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Jakich dokumentów potrzebuje kot?&lt;i data-lucide=&quot;chevron-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;p&gt;Przygotuj książeczkę zdrowia z aktualnymi szczepieniami lub zaświadczenie od lekarza weterynarii. Szczegółowe warunki przyjęcia znajdziesz w regulaminie.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;kg-contact&quot; class=&quot;kg-section kg-contact&quot;&gt;&lt;div class=&quot;kg-eyebrow&quot;&gt;Porozmawiajmy&lt;/div&gt;&lt;h2&gt;Każdy kot to&lt;br&gt;inna historia.&lt;/h2&gt;&lt;p class=&quot;kg-copy&quot;&gt;Chętnie poznamy Twojego. Zadzwoń lub napisz — odpowiemy na pytania przed pierwszym pobytem.&lt;/p&gt;&lt;div class=&quot;kg-contact-links&quot;&gt;&lt;a class=&quot;kg-contact-link phone&quot; href=&quot;tel:+48500000069&quot;&gt;&lt;i data-lucide=&quot;phone&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;small&gt;Zadzwoń do nas&lt;/small&gt;&lt;strong&gt;500 000 069&lt;/strong&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;kg-contact-link&quot; href=&quot;mailto:kontakt@kociegniazdko.pl&quot;&gt;&lt;i data-lucide=&quot;mail&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;small&gt;Napisz do nas&lt;/small&gt;&lt;strong&gt;kontakt@kociegniazdko.pl&lt;/strong&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;kg-address&quot;&gt;&lt;h3&gt;Odwiedź nasze gniazdko&lt;/h3&gt;&lt;p&gt;ul. Człuchowska 18&lt;br&gt;Warszawa, Wola · Jelonki&lt;/p&gt;&lt;p class=&quot;kg-small&quot;&gt;Jesteśmy do dyspozycji codziennie&lt;br&gt;w godzinach 10:00–20:00.&lt;/p&gt;&lt;a class=&quot;kg-textlink&quot; href=&quot;https://www.google.com/maps/dir/?api=1&amp;destination=52.23027,20.923376&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&lt;i data-lucide=&quot;map-pin&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Wyznacz trasę&lt;i data-lucide=&quot;arrow-up-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;kg-invite&quot;&gt;&lt;h2&gt;Masz już daty&lt;br&gt;wyjazdu?&lt;/h2&gt;&lt;p class=&quot;kg-copy&quot;&gt;Zgłoś planowany pobyt. Resztę ustalimy razem.&lt;/p&gt;&lt;a class=&quot;kg-cta&quot; href=&quot;https://www.kociegniazdko.pl/rezerwacja/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rezerwuj&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/a&gt;&lt;p class=&quot;kg-small&quot;&gt;Termin potwierdzimy telefonicznie lub e-mailem.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
